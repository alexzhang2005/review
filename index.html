<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日复盘</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>📝 每日复盘</h1>
      <p class="subtitle">记录每一天的成长与收获</p>
    </header>

    <main class="main">
      <!-- 新建复盘表单 -->
      <section class="card form-card" id="formSection">
        <h2 class="card-title">
          <span id="formTitle">新建复盘</span>
          <button class="btn btn-icon" id="toggleFormBtn" title="收起表单">▲</button>
        </h2>
        <form id="reviewForm" class="review-form">
          <div class="form-group">
            <label for="reviewDate">📅 日期</label>
            <input type="date" id="reviewDate" name="reviewDate" required />
          </div>

          <div class="form-group">
            <label for="achievements">🌟 今日成就</label>
            <textarea
              id="achievements"
              name="achievements"
              placeholder="今天完成了哪些事情？有哪些值得骄傲的成就？"
              rows="3"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label for="problems">⚠️ 遇到的问题</label>
            <textarea
              id="problems"
              name="problems"
              placeholder="今天遇到了哪些困难或挑战？"
              rows="3"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="learnings">💡 心得体会</label>
            <textarea
              id="learnings"
              name="learnings"
              placeholder="今天有哪些新的领悟或收获？"
              rows="3"
            ></textarea>
          </div>

          <div class="form-group">
            <label for="tomorrow">🎯 明日计划</label>
            <textarea
              id="tomorrow"
              name="tomorrow"
              placeholder="明天打算做什么？有什么需要跟进的事项？"
              rows="3"
            ></textarea>
          </div>

          <div class="form-group">
            <label>😊 心情评分</label>
            <div class="mood-selector">
              <label class="mood-option">
                <input type="radio" name="mood" value="1" />
                <span class="mood-emoji" title="很糟糕">😞</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="2" />
                <span class="mood-emoji" title="一般">😕</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="3" />
                <span class="mood-emoji" title="还好">😐</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="4" />
                <span class="mood-emoji" title="不错">😊</span>
              </label>
              <label class="mood-option">
                <input type="radio" name="mood" value="5" />
                <span class="mood-emoji" title="非常好">🤩</span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary hidden" id="cancelBtn">取消</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">保存复盘</button>
          </div>
        </form>
      </section>

      <!-- 历史记录 -->
      <section class="card history-card">
        <div class="history-header">
          <h2 class="card-title">📚 复盘记录</h2>
          <div class="history-controls">
            <input
              type="text"
              id="searchInput"
              placeholder="搜索复盘内容..."
              class="search-input"
            />
            <select id="sortSelect" class="sort-select">
              <option value="desc">最新在前</option>
              <option value="asc">最早在前</option>
            </select>
          </div>
        </div>
        <div id="reviewList" class="review-list">
          <div class="empty-state" id="emptyState">
            <div class="empty-icon">📖</div>
            <p>还没有复盘记录</p>
            <p class="empty-hint">填写上方表单开始你的第一次复盘吧！</p>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- 删除确认弹窗 -->
  <div class="modal-overlay hidden" id="deleteModal">
    <div class="modal">
      <h3>确认删除</h3>
      <p>确定要删除这条复盘记录吗？此操作不可恢复。</p>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="cancelDeleteBtn">取消</button>
        <button class="btn btn-danger" id="confirmDeleteBtn">删除</button>
      </div>
    </div>
  </div>

  <!-- 详情弹窗 -->
  <div class="modal-overlay hidden" id="detailModal">
    <div class="modal modal-large">
      <div class="modal-header">
        <h3 id="detailDate"></h3>
        <button class="btn btn-icon" id="closeDetailBtn">✕</button>
      </div>
      <div class="modal-body" id="detailContent"></div>
      <div class="modal-actions">
        <button class="btn btn-secondary" id="editFromDetailBtn">编辑</button>
        <button class="btn btn-primary" id="closeDetailBtn2">关闭</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

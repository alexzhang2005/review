<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票详情</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(180deg, #f8f9fa 0%, #e9ecef 100%);
  min-height: 100vh;
  color: #212529;
  font-size: 14px;
  line-height: 1.6;
}
.top-nav {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  padding: 0 24px;
  display: flex;
  align-items: center;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.top-nav a {
  color: rgba(255,255,255,0.7);
  text-decoration: none;
  font-size: 13px;
  padding: 6px 14px;
  border-radius: 6px;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.top-nav a:hover { color: #fff; background: rgba(255,255,255,0.1); }
.nav-brand { font-size: 16px; font-weight: 700; color: #ffd700 !important; margin-right: 32px; display: flex; align-items: center; gap: 8px; padding: 0 !important; }
.nav-brand:hover { background: transparent !important; }
.nav-spacer { flex: 1; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px; }

/* 股票头部 */
.stock-header {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 24px;
  position: relative;
  overflow: hidden;
}
.stock-header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 50%); animation: pulse 4s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } }
.stock-title { display: flex; align-items: center; gap: 16px; position: relative; }
.stock-title h1 { font-size: 32px; font-weight: 700; color: #fff; }
.stock-code { font-size: 14px; background: rgba(255,255,255,0.15); color: rgba(255,255,255,0.8); padding: 4px 12px; border-radius: 6px; font-family: 'SF Mono', 'Consolas', monospace; }
.stock-meta { display: flex; gap: 16px; margin-top: 12px; flex-wrap: wrap; position: relative; }
.stock-meta span { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); padding: 4px 12px; border-radius: 20px; font-size: 12px; }

/* 跟踪信息模块 */
.tracking-section {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.section-title { font-size: 16px; font-weight: 700; color: #212529; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.section-title .icon { font-size: 20px; }
.tracking-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.tracking-stats { font-size: 12px; color: #868e96; }
.tracking-upload-btn { background: linear-gradient(135deg, #ffd700, #ffed4e); color: #212529; border: none; padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
.tracking-upload-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,215,0,0.3); }
.upload-area { border: 2px dashed #dee2e6; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; transition: all 0.2s; }
.upload-area:hover { border-color: #ffd700; background: rgba(255,215,0,0.05); }
.upload-area .icon { font-size: 32px; margin-bottom: 8px; }
.upload-area p { color: #868e96; font-size: 13px; }
.upload-area span { color: #ffd700; font-weight: 600; }
.tracking-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
.tracking-item { background: #f8f9fa; border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; transition: all 0.2s; border: 1px solid transparent; }
.tracking-item:hover { border-color: #ffd700; background: #fff; }
.tracking-item .thumb { width: 40px; height: 40px; border-radius: 6px; background: #e9ecef; display: flex; align-items: center; justify-content: center; font-size: 18px; }
.tracking-item .info { flex: 1; min-width: 0; }
.tracking-item .name { font-size: 12px; font-weight: 600; color: #212529; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tracking-item .date { font-size: 11px; color: #868e96; }
.tracking-item .delete-btn { width: 24px; height: 24px; border-radius: 50%; background: #fff; border: 1px solid #dee2e6; color: #868e96; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.tracking-item .delete-btn:hover { background: #ff6b6b; color: #fff; border-color: #ff6b6b; }
.tracking-empty { text-align: center; padding: 24px; color: #adb5bd; font-size: 13px; }
#file-input { display: none; }

/* 详情模块卡片 */
.detail-card {
  background: #fff;
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; }
.info-item { padding: 12px; background: #f8f9fa; border-radius: 8px; }
.info-label { font-size: 12px; color: #868e96; margin-bottom: 4px; }
.info-value { font-size: 14px; font-weight: 600; color: #212529; }
.info-value.highlight { color: #ffd700; font-size: 18px; }
.info-value.red { color: #ff6b6b; }
.info-value.green { color: #51cf66; }
.section-subtitle { font-size: 15px; font-weight: 600; color: #212529; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-subtitle::before { content: ''; width: 4px; height: 16px; background: linear-gradient(180deg, #ffd700, #ffed4e); border-radius: 2px; }
.tag-cloud { display: flex; flex-wrap: wrap; gap: 6px; }
.concept-tag { background: linear-gradient(135deg, rgba(132,94,247,0.1), rgba(132,94,247,0.05)); color: #845ef7; border: 1px solid rgba(132,94,247,0.2); padding: 4px 10px; border-radius: 6px; font-size: 12px; transition: all 0.2s; cursor: default; }
.concept-tag:hover { background: #845ef7; color: #fff; }
.content-box { background: #f8f9fa; border-radius: 8px; padding: 16px; font-size: 13px; color: #495057; line-height: 1.8; }
.highlight-box { background: linear-gradient(135deg, rgba(255,215,0,0.1), rgba(255,237,78,0.05)); border: 1px solid rgba(255,215,0,0.2); border-radius: 8px; padding: 16px; }
.warning-box { background: linear-gradient(135deg, rgba(255,107,107,0.1), rgba(255,107,107,0.05)); border: 1px solid rgba(255,107,107,0.2); border-radius: 8px; padding: 16px; display: flex; align-items: flex-start; gap: 12px; }
.warning-box .icon { font-size: 20px; }
.warning-box .text { font-size: 13px; color: #c92a2a; line-height: 1.6; }
.business-content { max-height: 200px; overflow-y: auto; }
.business-content::-webkit-scrollbar { width: 6px; }
.business-content::-webkit-scrollbar-thumb { background: #dee2e6; border-radius: 3px; }
.back-btn { background: #fff; border: 1px solid #dee2e6; color: #495057; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
.back-btn:hover { border-color: #ffd700; color: #ffd700; }

/* 模态框查看大图/文档 */
.modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 24px; }
.modal.show { display: flex; }
.modal-content { background: #fff; border-radius: 16px; max-width: 90vw; max-height: 90vh; overflow: auto; position: relative; }
.modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; border: none; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: rgba(0,0,0,0.8); }
.modal img { max-width: 100%; max-height: 85vh; display: block; border-radius: 12px; }
.pdf-frame { width: 100%; height: 80vh; border: none; border-radius: 12px; }
.loading { text-align: center; padding: 48px; color: #868e96; }

@media (max-width: 768px) {
  .container { padding: 16px; }
  .stock-header { padding: 24px 16px; border-radius: 16px; }
  .stock-title h1 { font-size: 24px; }
  .card-grid { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>
<nav class="top-nav">
  <a href="index.html" class="nav-brand">📊 A股工具箱</a>
  <a href="index.html">🏠 首页</a>
  <a href="市场复盘_20260428_v3.html">📈 每日复盘</a>
  <a href="选股策略_三合一.html">🎯 选股策略</a>
  <span class="nav-spacer"></span>
</nav>

<div class="container">
  <!-- 返回按钮 -->
  <div style="margin-bottom: 16px;">
    <button class="back-btn" onclick="history.back()">← 返回</button>
  </div>

  <!-- 股票头部信息 -->
  <div class="stock-header">
    <div class="stock-title">
      <h1 id="stock-name">加载中...</h1>
      <span class="stock-code" id="stock-code">-</span>
    </div>
    <div class="stock-meta" id="stock-meta"></div>
  </div>

  <!-- 跟踪信息模块 -->
  <div class="tracking-section">
    <div class="tracking-header">
      <div class="section-title"><span class="icon">📎</span>跟踪信息</div>
      <button class="tracking-upload-btn" onclick="document.getElementById('file-input').click()">
        <span>＋</span> 添加文件
      </button>
    </div>
    <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.gif,.webp" multiple>
    <div class="upload-area" onclick="document.getElementById('file-input').click()">
      <div class="icon">📁</div>
      <p>点击或拖拽文件到这里上传</p>
      <p><span>PDF、图片</span> 格式均可</p>
    </div>
    <div class="tracking-list" id="tracking-list">
      <div class="tracking-empty">暂无跟踪文件，点击上方区域上传</div>
    </div>
  </div>

  <!-- 基本信息卡片 -->
  <div class="detail-card">
    <div class="section-subtitle">基本信息</div>
    <div class="card-grid">
      <div class="info-item">
        <div class="info-label">行业PE</div>
        <div class="info-value highlight" id="val-industry-pe">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">市盈率(TTM)</div>
        <div class="info-value" id="val-pe">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">一二级行业</div>
        <div class="info-value" id="val-industry">-</div>
      </div>
      <div class="info-item">
        <div class="info-label">品类</div>
        <div class="info-value" id="val-category">-</div>
      </div>
    </div>
  </div>

  <!-- 概念主题 -->
  <div class="detail-card">
    <div class="section-subtitle">概念和主题</div>
    <div class="tag-cloud" id="concept-tags"></div>
  </div>

  <!-- 主营构成 -->
  <div class="detail-card">
    <div class="section-subtitle">主营构成</div>
    <div class="content-box" id="val-business-type">-</div>
  </div>

  <!-- 主营业务 -->
  <div class="detail-card">
    <div class="section-subtitle">主营业务</div>
    <div class="content-box business-content" id="val-main-business">-</div>
  </div>

  <!-- 公司亮点 -->
  <div class="detail-card">
    <div class="section-subtitle">公司亮点</div>
    <div class="highlight-box" id="val-highlight">-</div>
  </div>

  <!-- 风险提示 -->
  <div class="detail-card">
    <div class="section-subtitle">风险提示</div>
    <div id="risk-container"></div>
  </div>
</div>

<!-- 查看大图/文档的模态框 -->
<div class="modal" id="preview-modal">
  <div class="modal-content" id="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="loading" id="modal-loading">加载中...</div>
  </div>
</div>

<script>
// 股票数据
let stockData = {};
// 跟踪文件
let trackingFiles = [];

// 获取股票代码
function getStockCode() {
  const params = new URLSearchParams(window.location.search);
  return params.get('code') || '';
}

// 加载股票数据
async function loadStockData() {
  try {
    const res = await fetch('stock_detail_data.json');
    stockData = await res.json();
    renderStockDetail();
  } catch (e) {
    console.error('加载数据失败:', e);
    document.getElementById('stock-name').textContent = '数据加载失败';
  }
}

// 渲染股票详情
function renderStockDetail() {
  const code = getStockCode();
  const info = stockData[code];
  
  if (!info) {
    document.getElementById('stock-name').textContent = '股票不存在';
    return;
  }

  // 股票名称和代码
  document.getElementById('stock-name').textContent = info['名称'] || '-';
  document.getElementById('stock-code').textContent = code;

  // 加载跟踪文件
  loadTrackingFiles(code);

  // 基本信息
  setVal('val-industry-pe', info['行业PE'] || '-', 'highlight');
  setVal('val-pe', info['市盈(TTM)'] || '-');
  setVal('val-industry', info['一二级行业'] || '-');
  setVal('val-category', info['品类'] || '-');

  // 概念标签
  const concepts = (info['概念和主题'] || '').split(/[,，、\s]+/).filter(Boolean);
  const tagHtml = concepts.map(c => `<span class="concept-tag">${c}</span>`).join('');
  document.getElementById('concept-tags').innerHTML = tagHtml || '<span style="color:#868e96">暂无概念</span>';

  // 主营构成
  setVal('val-business-type', info['主营构成'] || '-');

  // 主营业务
  setVal('val-main-business', info['主营业务'] || '-');

  // 公司亮点
  setVal('val-highlight', info['公司亮点'] || '-', '', true);

  // 风险提示
  const risk = info['风险提示'] || '';
  const riskContainer = document.getElementById('risk-container');
  if (risk) {
    riskContainer.innerHTML = `<div class="warning-box"><span class="icon">⚠️</span><span class="text">${risk}</span></div>`;
  } else {
    riskContainer.innerHTML = '<div class="content-box">暂无风险提示</div>';
  }
}

function setVal(id, val, extraClass = '', isHighlight = false) {
  const el = document.getElementById(id);
  el.textContent = val || '-';
  if (extraClass) el.classList.add(extraClass);
  if (isHighlight) el.style.cssText = 'font-size:14px;padding:12px;';
}

// 跟踪文件管理
function getTrackingKey(code) {
  return `tracking_${code}`;
}

function loadTrackingFiles(code) {
  const stored = localStorage.getItem(getTrackingKey(code));
  trackingFiles = stored ? JSON.parse(stored) : [];
  renderTrackingList();
}

function saveTrackingFiles() {
  const code = getStockCode();
  localStorage.setItem(getTrackingKey(code), JSON.stringify(trackingFiles));
}

function renderTrackingList() {
  const list = document.getElementById('tracking-list');
  if (trackingFiles.length === 0) {
    list.innerHTML = '<div class="tracking-empty">暂无跟踪文件，点击上方区域上传</div>';
    return;
  }
  list.innerHTML = trackingFiles.map((f, i) => `
    <div class="tracking-item" onclick="previewFile(${i})">
      <div class="thumb">${getFileIcon(f.type)}</div>
      <div class="info">
        <div class="name" title="${f.name}">${f.name}</div>
        <div class="date">${f.date}</div>
      </div>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteFile(${i})">×</button>
    </div>
  `).join('');
}

function getFileIcon(type) {
  if (type.includes('pdf')) return '📄';
  if (type.includes('image')) return '🖼️';
  return '📎';
}

function deleteFile(index) {
  trackingFiles.splice(index, 1);
  saveTrackingFiles();
  renderTrackingList();
}

function previewFile(index) {
  const file = trackingFiles[index];
  const modal = document.getElementById('preview-modal');
  const content = document.getElementById('modal-content');
  const loading = document.getElementById('modal-loading');
  
  modal.classList.add('show');
  
  if (file.type.includes('image')) {
    loading.style.display = 'none';
    content.innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <img src="${file.data}" alt="${file.name}">
    `;
  } else if (file.type.includes('pdf')) {
    loading.style.display = 'block';
    content.innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="loading" id="modal-loading">加载中...</div>
      <iframe class="pdf-frame" src="${file.data}"></iframe>
    `;
  }
}

function closeModal() {
  document.getElementById('preview-modal').classList.remove('show');
}

// 文件上传处理
document.getElementById('file-input').addEventListener('change', function(e) {
  handleFiles(e.target.files);
});

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const fileData = {
        name: file.name,
        type: file.type,
        data: e.target.result,
        date: new Date().toLocaleDateString()
      };
      trackingFiles.push(fileData);
      saveTrackingFiles();
      renderTrackingList();
    };
    reader.readAsDataURL(file);
  });
}

// 拖拽上传
const uploadArea = document.querySelector('.upload-area');
uploadArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '#ffd700';
  uploadArea.style.background = 'rgba(255,215,0,0.1)';
});
uploadArea.addEventListener('dragleave', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '#dee2e6';
  uploadArea.style.background = '';
});
uploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '#dee2e6';
  uploadArea.style.background = '';
  handleFiles(e.dataTransfer.files);
});

// 初始化
loadStockData();
</script>
</body>
</html>

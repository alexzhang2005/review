<script>
// 股票数据
let stockInfo = null;
let trackingData = {};
let strategyData = null;  // 策略数据缓存
let conceptMapping = null;  // 概念映射缓存
let stockDetailIndex = null;  // 股票索引缓存
let currentConcept = '';    // 当前选中的概�?
// 获取股票代码
function getStockCode() {
  const params = new URLSearchParams(window.location.search);
  return params.get('code') || '';
}

// 缓存已加载的详情数据
const detailCache = {};

// 按需加载单个股票的详情数�?async function loadStockDetail(code) {
  if (detailCache[code]) {
    return detailCache[code];
  }
  
  document.getElementById('loading-indicator').style.display = 'flex';
  
  try {
    // 分片文件索引映射 (�?00条一个文�?
    const idx = parseInt(code) % 5500 / 100 | 0;
    const filename = `/stock_data/stock_detail_${String(idx).padStart(3, '0')}.json`;
    const res = await fetch(filename);
    const data = await res.json();
    
    const info = data[code];
    if (info) {
      detailCache[code] = info;
    }
    
    document.getElementById('loading-indicator').style.display = 'none';
    return info;
  } catch (e) {
    console.error('加载详情失败:', e);
    document.getElementById('loading-indicator').style.display = 'none';
    return null;
  }
}

// 加载策略数据
async function loadStrategyData() {
  if (strategyData) return;  // 已缓�?  try {
    const res = await fetch('/strategy_data.json');
    strategyData = await res.json();
  } catch (e) {
    console.error('加载策略数据失败:', e);
  }
}

// 加载概念映射
async function loadConceptMapping() {
  if (conceptMapping) return;  // 已缓�?  try {
    const res = await fetch('/concept_mapping.json?t=' + Date.now());
    conceptMapping = await res.json();
  } catch (e) {
    console.error('加载概念映射失败:', e);
    conceptMapping = {};
  }
}

// 加载股票数据（快速加载基本信息）
async function loadStockData() {
  const code = getStockCode();
  
  if (!code) {
    document.getElementById('stock-name').textContent = '未提供股票代�?;
    return;
  }
  
  try {
    // 先显示代码（快速）
    document.getElementById('stock-code').textContent = code;
    
    // 直接从项目目录加载基本信�?    const res = await fetch('/stock_detail_index.json');
    const index = await res.json();
    // 保存到缓存变�?    stockDetailIndex = index;
    
    const basicInfo = index[code];
    if (basicInfo) {
      document.getElementById('stock-name').textContent = basicInfo['名称'] || code;
      document.getElementById('val-industry-pe').textContent = basicInfo['行业PE'] || '-';
      document.getElementById('val-industry').textContent = basicInfo['一二级行业'] || '-';
    }
    
    // 加载跟踪数据（localStorage�?    loadTrackingData(code);

    // 异步加载策略数据和概念映�?    loadStrategyData();
    loadConceptMapping();
    
    // 异步加载完整详情
    const fullInfo = await loadStockDetail(code);
    if (fullInfo) {
      renderFullDetail(fullInfo);
    } else {
      document.getElementById('stock-name').textContent = basicInfo?.['名称'] || code + ' (部分数据)';
    }
    
  } catch (e) {
    console.error('加载数据失败:', e);
    document.getElementById('stock-name').textContent = '数据加载失败';
  }
}

// 渲染完整详情（按需加载后调用）
function renderFullDetail(info) {
  // 基本信息
  setVal('val-pe', info['市盈(TTM)'] || '-');
  setVal('val-category', info['品类'] || '-');
  
  // 概念标签
  const concepts = (info['概念和主�?] || '').split(/[,，、\s]+/).filter(Boolean);
  if (concepts.length > 0) {
    document.getElementById('concept-section').style.display = 'block';
    // 保存概念列表
    window.stockConcepts = concepts;
    // 保存当前股票代码
    window.currentStockCode = getStockCode();
    // 生成可点击的标签（先不显示数字）
    const tagHtml = concepts.map(c => {
      const count = conceptMapping && conceptMapping[c] ? conceptMapping[c].length : '...';
      return `<span class="concept-tag" data-concept="${c}">${c} (${count})</span>`;
    }).join('');
    document.getElementById('concept-tags').innerHTML = tagHtml;
    // 添加点击事件
    document.querySelectorAll('.concept-tag').forEach(tag => {
      tag.addEventListener('click', handleConceptClick);
    });
    
    // 如果概念映射还未加载，异步更新数�?    if (!conceptMapping) {
      loadConceptMapping().then(() => {
        updateConceptCounts(concepts);
      });
    }
  }
  
  // 主营构成
  if (info['主营构成']) {
    document.getElementById('business-section').style.display = 'block';
    setVal('val-business-type', info['主营构成']);
  }
  
  // 主营业务
  if (info['主营业务']) {
    document.getElementById('main-biz-section').style.display = 'block';
    setVal('val-main-business', info['主营业务']);
  }
  
  // 公司亮点
  if (info['公司亮点']) {
    document.getElementById('highlight-section').style.display = 'block';
    document.getElementById('val-highlight').textContent = info['公司亮点'];
  }
  
  // 风险提示
  if (info['风险提示']) {
    document.getElementById('risk-section').style.display = 'block';
    document.getElementById('risk-container').innerHTML = 
      `<div class="warning-box"><span class="icon">⚠️</span><span class="text">${info['风险提示']}</span></div>`;
  }
}

function setVal(id, val, extraClass = '') {
  const el = document.getElementById(id);
  if (el) {
    el.textContent = val || '-';
    if (extraClass) el.classList.add(extraClass);
  }
}

// ========== 跟踪数据管理 ==========
function getTrackingKey(code) {
  return `tracking_${code}`;
}

function loadTrackingData(code) {
  const stored = localStorage.getItem(getTrackingKey(code));
  trackingData = stored ? JSON.parse(stored) : { text: '', textDate: '', files: [] };
  
  // 渲染文本
  document.getElementById('tracking-text').value = trackingData.text || '';
  updateCharCount();
  updateLastSaveTime();
  
  // 渲染文件
  renderFileList();
}

function saveTrackingData() {
  const code = getStockCode();
  localStorage.setItem(getTrackingKey(code), JSON.stringify(trackingData));
}

// 文本跟踪
function saveText() {
  const text = document.getElementById('tracking-text').value;
  trackingData.text = text;
  trackingData.textDate = new Date().toLocaleString('zh-CN');
  saveTrackingData();
  updateLastSaveTime();
  alert('笔记已保存！');
}

function updateCharCount() {
  const text = document.getElementById('tracking-text').value;
  document.getElementById('char-count').textContent = `${text.length} 字符`;
}

function updateLastSaveTime() {
  const el = document.getElementById('last-save-time');
  if (trackingData.textDate) {
    el.textContent = `最后保�? ${trackingData.textDate}`;
  } else {
    el.textContent = '';
  }
}

function viewText() {
  if (!trackingData.text) {
    alert('暂无笔记内容');
    return;
  }
  document.getElementById('text-viewer-date').textContent = trackingData.textDate || '';
  document.getElementById('text-viewer-content').textContent = trackingData.text;
  document.getElementById('text-modal').classList.add('show');
}

function closeTextModal() {
  document.getElementById('text-modal').classList.remove('show');
}

// 文件管理
function renderFileList() {
  const list = document.getElementById('tracking-list');
  if (!trackingData.files || trackingData.files.length === 0) {
    list.innerHTML = '<div class="tracking-empty">暂无附件，点击上方区域上�?/div>';
    return;
  }
  list.innerHTML = trackingData.files.map((f, i) => `
    <div class="tracking-item" onclick="previewFile(${i})">
      <div class="thumb">${getFileIcon(f.type)}</div>
      <div class="info">
        <div class="name" title="${f.name}">${f.name}</div>
        <div class="date">${f.date}</div>
      </div>
      <button class="delete-btn" onclick="event.stopPropagation(); deleteFile(${i})">×</button>
    </div>
  `).join('');
}

function getFileIcon(type) {
  if (type.includes('pdf')) return '📄';
  if (type.includes('image')) return '🖼�?;
  return '📎';
}

function deleteFile(index) {
  if (confirm('确定要删除这个文件吗�?)) {
    trackingData.files.splice(index, 1);
    saveTrackingData();
    renderFileList();
  }
}

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = function(e) {
      const fileData = {
        name: file.name,
        type: file.type,
        data: e.target.result,
        date: new Date().toLocaleDateString()
      };
      if (!trackingData.files) trackingData.files = [];
      trackingData.files.push(fileData);
      saveTrackingData();
      renderFileList();
    };
    reader.readAsDataURL(file);
  });
}

function previewFile(index) {
  const file = trackingData.files[index];
  const modal = document.getElementById('preview-modal');
  const content = document.getElementById('modal-content');
  
  modal.classList.add('show');
  
  if (file.type.includes('image')) {
    content.innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <img src="${file.data}" alt="${file.name}">
    `;
  } else if (file.type.includes('pdf')) {
    content.innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <iframe class="pdf-frame" src="${file.data}"></iframe>
    `;
  } else {
    content.innerHTML = `
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="loading">无法预览此文件类�? ${file.name}</div>
    `;
  }
}

function closeModal() {
  document.getElementById('preview-modal').classList.remove('show');
}

// 文件上传事件
document.getElementById('file-input').addEventListener('change', function(e) {
  handleFiles(e.target.files);
  e.target.value = '';
});

// 文本输入监听
document.getElementById('tracking-text').addEventListener('input', updateCharCount);

// 拖拽上传
const uploadArea = document.querySelector('.upload-area');
uploadArea.addEventListener('dragover', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '#ffd700';
  uploadArea.style.background = 'rgba(255,215,0,0.1)';
});
uploadArea.addEventListener('dragleave', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '#dee2e6';
  uploadArea.style.background = '';
});
uploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadArea.style.borderColor = '#dee2e6';
  uploadArea.style.background = '';
  handleFiles(e.dataTransfer.files);
});

// 初始�?loadStockData();

// 更新概念标签的数�?async function updateConceptCounts(concepts) {
  if (!conceptMapping) {
    await loadConceptMapping();
  }
  
  concepts.forEach(concept => {
    const tag = document.querySelector(`.concept-tag[data-concept="${concept}"]`);
    if (tag && conceptMapping[concept]) {
      const count = conceptMapping[concept].length;
      tag.textContent = `${concept} (${count})`;
    }
  });
}

// ========== 概念股票关联 ==========
// 处理概念标签点击
function handleConceptClick(e) {
  const concept = e.target.dataset.concept;
  const currentCode = window.currentStockCode;

  // 切换选中状�?  document.querySelectorAll('.concept-tag').forEach(tag => {
    tag.classList.remove('active');
  });
  e.target.classList.add('active');

  // 查找同概念的策略股票
  showRelatedStocks(concept, currentCode);
}

// 显示同概念股票（使用概念映射，高性能�?async function showRelatedStocks(concept, excludeCode) {
  const section = document.getElementById('related-stocks-section');
  const list = document.getElementById('related-stocks-list');
  const title = document.getElementById('related-stocks-title');
  // 确保策略数据已加载
  await loadStrategyData();
  
  if (!conceptMapping || !stockDetailIndex) {
    section.style.display = 'none';
    return;
  }
  
  // 从概念映射获取同概念的股票代码列�?  const codes = conceptMapping[concept] || [];
  const filteredCodes = codes.filter(c => c !== excludeCode);
  
  title.textContent = `"${concept}" 相关股票 (${filteredCodes.length}�?`;
  
  if (filteredCodes.length > 0) {
    section.style.display = 'block';
    
    // 构建股票列表HTML
    const stockHtml = filteredCodes.slice(0, 30).map(code => {
      const basicInfo = stockDetailIndex[code] || {};
      const name = basicInfo.name || code;
      
      // 查找策略信息
      let strategies = [];
      if (strategyData) {
        const s = strategyData.find(item => String(item.code).trim() === String(code).trim());
        if (s) {
          if (s.s1) strategies.push('持股增长');
          if (s.s2) strategies.push('盈利质量');
          if (s.s3) strategies.push('全速前进');
          if (s.s4) strategies.push('机构持股增长');
        }
      }
      
      return `<div class="related-stock-item" onclick="openStockDetail('${code}')">
        <span class="stock-name">${name}</span>
        <span class="stock-code">${code}</span>
        ${strategies.length > 0 ? `<span class="stock-strategies">${strategies.join(', ')}</span>` : '<span class="stock-strategies" style="color:#999;">未命�?/span>'}
      </div>`;
    }).join('');
    
    list.innerHTML = stockHtml + (filteredCodes.length > 30 ? `<div class="related-more">还有 ${filteredCodes.length - 30} �?..</div>` : '');
  } else {
    section.style.display = 'block';
    list.innerHTML = '<div class="related-empty">暂无同概念股�?/div>';
  }
}

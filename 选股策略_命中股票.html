<script>
const fmt = (n, d=1) => n==null||isNaN(n) ? '<span style="color:#adb5bd">—</span>' : n.toFixed(d);
const fmtG = g => { if(g==null||isNaN(g)) return '<span style="color:#adb5bd">—</span>'; return `<span class="${g>=0?'pos':'neg'}">${g>=0?'+':''}${g.toFixed(1)}%</span>`; };
const fmtPct = v => { if(v==null) return '<span style="color:#adb5bd">—</span>'; return `<span class="${v>=0?'pos':'neg'}">${v>=0?'+':''}${v.toFixed(2)}%</span>`; };
const fmtClose = v => v==null ? '<span style="color:#adb5bd">—</span>' : v.toFixed(2);
const fmtWan = v => { if(v==null) return '<span style="color:#adb5bd">—</span>'; if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+'亿'; if(Math.abs(v)>=1e4) return (v/1e4).toFixed(1)+'万'; return v.toFixed(0); };
const fmtY = v => { if(v==null) return '<span style="color:#adb5bd">—</span>'; if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+'亿'; return (v/1e4).toFixed(0)+'万'; };

// 增长点样式：上升红色●，下降绿色○
const dotUp = '<span style="color:#ff6b6b">●</span>';
const dotDown = '<span style="color:#51cf66">○</span>';
const dotFlat = '<span style="color:#adb5bd">○</span>';

function growthDot(g) {
  if(g==null) return dotFlat;
  return g > 0 ? dotUp : (g < 0 ? dotDown : dotFlat);
}

// 连续增长期数点
function trailDots(changes) {
  if(!changes) return '';
  let html = '';
  for(let i=0; i<6; i++) {
    const c = changes[i];
    if(c === null) { html += '<span style="color:#dee2e6">○</span>'; }
    else if(c === 1) { html += dotUp; }
    else { html += dotDown; }
  }
  return html;
}

// 带增速的数字显示
function fmtWithGrowth(val, growth, isWan=false) {
  if(val==null) return '<span style="color:#adb5bd">—</span>';
  const vStr = isWan ? (val/1e4).toFixed(0)+'万' : (Math.abs(val)>=1e8 ? (val/1e8).toFixed(2)+'亿' : (val/1e4).toFixed(0)+'万');
  if(growth == null) return vStr;
  const gStr = growth >= 0 ? '+'+growth.toFixed(1)+'%' : growth.toFixed(1)+'%';
  return vStr + ' <span class="'+(growth>=0?'pos':'neg')+'" style="font-size:11px">'+gStr+'</span>';
}

// 带增速的百分比
function fmtPctWithGrowth(val, growth) {
  if(val==null) return '<span style="color:#adb5bd">—</span>';
  const vStr = val.toFixed(2)+'%';
  if(growth == null) return vStr;
  const gStr = growth >= 0 ? '+'+growth.toFixed(1)+'%' : growth.toFixed(1)+'%';
  return vStr + ' <span class="'+(growth>=0?'pos':'neg')+'" style="font-size:11px">'+gStr+'</span>';
}

function stockLink(code) {
  return `<a class="stock-code" href="javascript:void(0)" onclick="showDetail('${code}')">${code}</a>`;
}

function sTags(s) {
  if(s.all) return '<span class="tag-gold">★ 三合一</span>';
  let h='<div class="strategy-tags">';
  if(s.s1) h+='<span class="tag-s1">持股</span>';
  if(s.s2) h+='<span class="tag-s2">盈利</span>';
  if(s.s3) h+='<span class="tag-s3">加速</span>';
  return h+'</div>';
}

// 分页器
function pager(len, pg, fn) {
  const PAGE_SIZE = 20;
  const total = Math.ceil(len/PAGE_SIZE);
  if(total<=1) return {start:0, end:Math.min(PAGE_SIZE, len), html:''};
  let h = `<div class="pagination">`;
  h += `<button class="pg-btn" onclick="${fn}(${pg-1})" ${pg<=1?'disabled':''}>‹</button>`;
  const range = buildRange(pg, total);
  range.forEach(p => { if(p==='...') h += `<span class="pg-info">…</span>`; else h += `<button class="pg-btn${p===pg?' active':''}" onclick="${fn}(${p})">${p}</button>`; });
  h += `<button class="pg-btn" onclick="${fn}(${pg+1})" ${pg>=total?'disabled':''}>›</button>`;
  h += `<span class="pg-info">${pg}/${total}页 · ${len}条</span></div>`;
  return {html: h, start: (pg-1)*PAGE_SIZE, end: Math.min(pg*PAGE_SIZE, len)};
}
function buildRange(cur, total) {
  if(total<=7) return Array.from({length:total},(_,i)=>i+1);
  const r=[];
  if(cur<=4){for(let i=1;i<=5;i++)r.push(i);r.push('...');r.push(total);}
  else if(cur>=total-3){r.push(1);r.push('...');for(let i=total-4;i<=total;i++)r.push(i);}
  else{r.push(1);r.push('...');r.push(cur-1);r.push(cur);r.push(cur+1);r.push('...');r.push(total);}
  return r;
}

// 导出CSV
function exportCSV(list, filename) {
  const headers = [];
  const rows = [];
  // 根据列表类型获取表头
  if(list[0]) {
    if(list[0].kf_g) {
      // 盈利质量/全速前进格式
      headers.push('代码','名称','行业','收盘','涨幅','命中策略');
    } else {
      headers.push('代码','名称','行业','收盘','涨幅','命中策略');
    }
  }
  
  // 简单CSV导出
  let csv = '﻿'; // BOM for UTF-8
  const data = list;
  
  // 通用表头
  const h = ['代码','名称','行业','收盘价','涨跌幅'];
  if(data[0]) {
    if(data[0].roe) h.push('ROE25','ROE24','ROE23','ROE22','ROE21');
    if(data[0].ml) h.push('毛利率25','毛利率24','毛利率23','毛利率22','毛利率21');
    if(data[0].mg) h.push('净利率25','净利率24','净利率23','净利率22','净利率21');
    if(data[0].kf) h.push('扣非净利25','扣非净利24','扣非净利23','扣非净利22','扣非净利21');
    if(data[0].ysr) h.push('营收25','营收24','营收23','营收22','营收21');
    if(data[0].sd) h.push('26Q1持股','25Q4持股','25Q3持股','25Q2持股');
    h.push('命中策略');
  }
  csv += h.join(',') + '\n';
  
  data.forEach(s => {
    const row = [
      s.code || '',
      s.name || '',
      s.ind || '',
      s.close != null ? s.close.toFixed(2) : '',
      s.pct_chg != null ? s.pct_chg.toFixed(2)+'%' : '',
    ];
    if(s.roe) { for(let i=0;i<5;i++) row.push(s.roe[i]!=null ? s.roe[i].toFixed(2)+'%' : ''); }
    if(s.ml) { for(let i=0;i<5;i++) row.push(s.ml[i]!=null ? s.ml[i].toFixed(2)+'%' : ''); }
    if(s.mg) { for(let i=0;i<5;i++) row.push(s.mg[i]!=null ? s.mg[i].toFixed(2)+'%' : ''); }
    if(s.kf) { for(let i=0;i<5;i++) row.push(s.kf[i]!=null ? (s.kf[i]/1e8).toFixed(2)+'亿' : ''); }
    if(s.ysr) { for(let i=0;i<5;i++) row.push(s.ysr[i]!=null ? (s.ysr[i]/1e8).toFixed(2)+'亿' : ''); }
    if(s.sd) { for(let i=0;i<4;i++) row.push(s.sd[i]!=null ? (s.sd[i]/1e4).toFixed(0)+'万' : ''); }
    let strats = [];
    if(s.s1) strats.push('持股增长');
    if(s.s2) strats.push('盈利质量');
    if(s.s3) strats.push('全速前进');
    if(s.all) strats = ['三合一'];
    row.push(strats.join('|'));
    csv += row.join(',') + '\n';
  });
  
  const blob = new Blob([csv], {type: 'text/csv;charset=utf-8;'});
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = filename;
  link.click();
}

const sortState = {};

// 获取排序图标
function getSortIcon(key) {
  const state = sortState[key];
  if (!state) return '<span class="sort-icon">⇅</span>';
  return state.asc ? '<span class="sort-icon">↑</span>' : '<span class="sort-icon">↓</span>';
}

// 通用排序函数
function sortData(data, key, getValue, asc) {
  return [...data].sort((a, b) => {
    const va = getValue(a);
    const vb = getValue(b);
    if (va == null && vb == null) return 0;
    if (va == null) return asc ? 1 : -1;
    if (vb == null) return asc ? -1 : 1;
    return asc ? va - vb : vb - va;
  });
}

// 排序切换
function toggleSort(key, getValue, currentList, renderFn) {
  if (!sortState[key]) {
    sortState[key] = { asc: false }; // 默认降序
  } else {
    sortState[key].asc = !sortState[key].asc;
  }
  const sorted = sortData(currentList, key, getValue, sortState[key].asc);
  renderFn(sorted, 1);
  updateSortHeaders(key);
}

// 更新排序表头样式
function updateSortHeaders(activeKey) {
  document.querySelectorAll('.sortable').forEach(th => {
    const k = th.dataset.sortKey;
    if (k === activeKey) {
      th.classList.add('active');
    } else {
      th.classList.remove('active');
    }
  });
}

let allList = DATA.sort
let currentAllList = [...DATA].sort

document.addEventListener('DOMContentLoaded', () => {
    renderStockList(currentAllList, 1);
});

function switchView(view) {
    document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');
    document.querySelectorAll('.action-btn').forEach(el => el.classList.remove('active'));
    document.getElementById('view-' + view).style.display = 'block';
    document.querySelector('.action-btn[onclick="switchView(\''+view+'\')"]').classList.add('active');
    if(view === 'stock') renderStockList(currentAllList, 1);
    if(view === 'sector') renderSectorView();
}

function renderStockList(list, pg) {
    currentAllList = list;
    const p = pager(list.length, pg, 'renderAllListPage');
    document.getElementById('pager-top').innerHTML = p.html;
    document.getElementById('pager-bot').innerHTML = p.html;
    
    let html = `<thead><tr>
        <th class="sortable" data-sort-key="code" onclick="toggleSort('code', s=>s.code, currentAllList, renderStockList)">代码</th>
        <th>名称</th>
        <th class="sortable" data-sort-key="ind" onclick="toggleSort('ind', s=>s.ind||'', currentAllList, renderStockList)">行业</th>
        <th class="sortable" data-sort-key="hits" onclick="toggleSort('hits', s=>s.hits, currentAllList, renderStockList)">命中数</th>
        <th class="sortable" data-sort-key="roe_g0" onclick="toggleSort('roe_g0', s=>s.roe_g[0]??-999, currentAllList, renderStockList)">ROE25增速</th>
        <th class="sortable" data-sort-key="ml_g0" onclick="toggleSort('ml_g0', s=>s.ml_g[0]??-999, currentAllList, renderStockList)">毛利25增速</th>
        <th class="sortable" data-sort-key="kf_g0" onclick="toggleSort('kf_g0', s=>s.kf_g[0]??-999, currentAllList, renderStockList)">扣非25增速</th>
    </tr></thead><tbody>`;
    
    list.slice(p.start, p.end).forEach(s => {
        html += `<tr>
            <td>${stockLink(s.code)}</td>
            <td class="stock-name" onclick="showDetail('${s.code}')">${s.name}${s.all?' ⭐':''}</td>
            <td><span class="ind-tag">${s.ind||'—'}</span></td>
            <td>${sTags(s)}</td>
            <td>${fmtPctWithGrowth(s.roe[0], s.roe_g[0])}</td>
            <td>${fmtPctWithGrowth(s.ml[0], s.ml_g[0])}</td>
            <td>${fmtWithGrowth(s.kf[0], s.kf_g[0])}</td>
        </tr>`;
    });
    html += '</tbody>';
    document.getElementById('stock-table').innerHTML = html;
}

function renderSectorView() {
    const sectors = {};
    allList.forEach(s => {
        const ind1 = s.ind1 || '未分类';
        if(!sectors[ind1]) sectors[ind1] = {count: 0, stocks: []};
        sectors[ind1].count++;
        sectors[ind1].stocks.push(s);
    });
    
    const sorted = Object.entries(sectors).sort((a,b) => b[1].count - a[1].count);
    
    let sidebarHtml = '';
    sorted.forEach(([ind1, data], i) => {
        sidebarHtml += `<div class="sector-item ${i===0?'active':''}" onclick="selectSector('${encodeURIComponent(ind1)}', this)">
            <span class="sector-name">${ind1}</span>
            <span class="sector-count">${data.count}</span>
        </div>`;
    });
    document.getElementById('sector-list').innerHTML = sidebarHtml;
    
    if(sorted.length > 0) {
        currentSector = sorted[0][0];
        document.getElementById('current-sector-name').textContent = sorted[0][0];
        renderSectorStocks(sorted[0][1].stocks);
    }
}

let currentSector = 'all';
function selectSector(ind1, el) {
    currentSector = decodeURIComponent(ind1);
    document.querySelectorAll('.sector-item').forEach(e => e.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('current-sector-name').textContent = currentSector;
    const stocks = allList.filter(s => s.ind1 === currentSector);
    renderSectorStocks(stocks);
}

function renderSectorStocks(stocks) {
    let html = `<thead><tr>
        <th>代码</th><th>名称</th><th>命中</th>
        <th>25ROE</th><th>25毛利</th><th>25扣非</th>
    </tr></thead><tbody>`;
    
    stocks.forEach(s => {
        html += `<tr>
            <td>${stockLink(s.code)}</td>
            <td class="stock-name" onclick="showDetail('${s.code}')">${s.name}${s.all?' ⭐':''}</td>
            <td>${sTags(s)}</td>
            <td>${fmtPctWithGrowth(s.roe[0], s.roe_g[0])}</td>
            <td>${fmtPctWithGrowth(s.ml[0], s.ml_g[0])}</td>
            <td>${fmtWithGrowth(s.kf[0], s.kf_g[0])}</td>
        </tr>`;
    });
    html += '</tbody>';
    document.getElementById('sector-table').innerHTML = html;
    document.getElementById('sector-stock-count').textContent = stocks.length + ' 只';
}


function renderAllListPage(pg) { renderStockList(currentAllList, pg); }
function exportCurrent() {
    exportCSV(allList, '命中股票_${new Date().toISOString().slice(0,10)}.csv');
}
